<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1424">
    <title>Product Inventory | GitHub Pages</title>
    <style>
        :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #070d18; color: #eef3ff; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #14264a 0, #070d18 58%); }
        main { width: min(100%, 620px); padding: 48px; border: 1px solid #263653; border-radius: 16px; background: rgba(13, 25, 45, .92); box-shadow: 0 28px 90px #0008; }
        .mark { width: 52px; height: 52px; display: grid; place-items: center; margin-bottom: 28px; border-radius: 14px; background: linear-gradient(145deg, #7948f5, #315eff); font-size: 25px; font-weight: 800; }
        .eyebrow { color: #90a5ff; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 9px 0 12px; font-size: clamp(30px, 7vw, 46px); line-height: 1.08; }
        p { max-width: 48ch; margin: 0; color: #aab6cc; line-height: 1.65; }
        a { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; padding: 13px 18px; border-radius: 9px; background: linear-gradient(100deg, #7046ee, #315eff); color: white; font-weight: 700; text-decoration: none; }
        a:hover { filter: brightness(1.12); }
        .note { margin-top: 22px; padding-top: 18px; border-top: 1px solid #263653; font-size: 13px; }
        @media (max-width: 520px) { main { padding: 30px 24px; } }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">P</div>
        <div class="eyebrow">Product Inventory</div>
        <h1>Inventory Management System</h1>
        <p>This GitHub Pages site stays on GitHub. Open the live Laravel application when you want to sign in and use the system.</p>
        <a href="https://productinventory.infinityfreeapp.com/login">Open Live App <span aria-hidden="true">↗</span></a>
        <p class="note">The live application runs on its PHP host; GitHub Pages serves this static page.</p>
    </main>
</body>
</html>
